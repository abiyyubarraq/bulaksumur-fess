name: Lint

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install dependencies
        working-directory: ./functions
        run: bun install
        
      - name: Install Biome
        working-directory: ./functions
        run: bun add -d @biomejs/biome
        
      - name: Run linter
        working-directory: ./functions
        run: bun run lint
